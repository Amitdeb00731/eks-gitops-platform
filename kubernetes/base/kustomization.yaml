apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# The image the deployment's placeholder name resolves to. The CI promote stage
# runs `kustomize edit set image sample-app=<registry>/sample-app:<tag>` and
# commits the change, so this file is the single record of what is deployed, and
# ArgoCD reconciles the cluster to it.
images:
  - name: sample-app
    newName: registry.gitlab.com/portfolio-group5140947/eks-gitops-platform/sample-app
    newTag: "0.1.0"
